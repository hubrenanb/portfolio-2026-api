version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=portfolio_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: